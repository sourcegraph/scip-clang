name: "Tag release"

# Tags a release when a version bump in Version.h lands on main.
on:
  push:
    branches: ["main"]
    paths: ["indexer/Version.h"]

permissions:
  contents: write
  actions: write

jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: "🏷️ Tag and publish release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^#define VERSION "(.*)"/\1/p' indexer/Version.h)"
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists"
            exit 0
          fi
          NEW_VERSION="$VERSION" ./tools/version_check.sh

          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

          # Tags pushed with GITHUB_TOKEN don't trigger workflows,
          # so start the release workflows for the tag explicitly.
          gh workflow run release.yml --ref "$TAG" -f revision="$TAG" -f create_release=true
          gh workflow run release-docker.yml --ref "$TAG"
